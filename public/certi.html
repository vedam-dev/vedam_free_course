<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Certificate of Completion</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #4b1869;
      --muted: #7a7a7a;
      --name: #4d2180;
      --page-bg: #f3f5f7;
      --card-width: 1100px;
      --card-height: 800px;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--page-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .certificate {
      width: var(--card-width);
      height: var(--card-height);
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(20,20,30,0.25);
      background-image: url('certiBg.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 56px 72px;
      box-sizing: border-box;
    }

    .content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    h1.c-title {
      margin: 120px 0px;
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: 52px;
      color: black;
      line-height: 1.02;
    }

    .subtitle {
      color: var(--muted);
      font-size: 22px;
      font-weight: 400;
    }

    .recipient {
      margin-top: 28px;
      font-family: "Poppins", sans-serif;
      font-size: 36px;
      color: var(--name);
      font-weight: 700;
    }

    .meta {
      margin-top: 20px;
      color: var(--muted);
      font-size: 22px;
      font-weight: 400;
    }

    .meta strong {
      color: #2b2b2b;
      font-weight: 700;
    }

    .course-brand {
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      background: linear-gradient(90deg,#6a2bd6,#f07a2b);
      -webkit-background-clip: text;
      color: transparent;
      font-size: 22px;
      margin-left: 6px;
    }

    .signature-block {
      position: absolute;
      left: 72px;
      bottom: 64px;
    }

    .signature-block .sig-name {
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #0f1724;
    }

    .signature-block .sig-title {
      font-size: 14px;
      color: var(--muted);
    }

    button#downloadBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4b1869;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    button#downloadBtn:hover {
      background: #5e1f89;
    }
  </style>
</head>
<body>
 <div class="certificate" role="img" aria-label="Certificate frame background">
    <div class="content">
      <!-- left main block containing the textual certificate content -->
      <div class="main">
        <h1 class="c-title">Certificate of Completion</h1>
        <div class="subtitle">Proudly presented to</div>

        <!-- recipient name (change text) -->
        <div class="recipient">{{Your Name here}}</div>

        <!-- smaller explanation row -->
        <div class="meta">
          <span>For successfully completing
            <strong>{{Subject Name here }}</strong>
            <span class="course-brand">CodeSprint</span></span>
        </div>
      </div>
    </div>
  </div>

  <button id="downloadBtn">Download JPG</button>

  <script>
    async function downloadCertificateAsJPG() {
      const certificate = document.getElementById("certificate");
      const rect = certificate.getBoundingClientRect();

      const canvas = document.createElement("canvas");
      canvas.width = rect.width;
      canvas.height = rect.height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, rect.width, rect.height);

      // Use SVG serialization to draw HTML
      const data = `
        <svg xmlns='http://www.w3.org/2000/svg' width='${rect.width}' height='${rect.height}'>
          <foreignObject width='100%' height='100%'>
            ${new XMLSerializer().serializeToString(certificate)}
          </foreignObject>
        </svg>`;

      const svgBlob = new Blob([data], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();

      img.onload = () => {
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const link = document.createElement("a");
        link.download = "certificate.jpg";
        link.href = canvas.toDataURL("image/jpeg", 1.0);
        link.click();
      };
      img.onerror = (err) => {
        console.error("Error rendering certificate:", err);
        alert("Error while generating image. Check background image path or try Chrome.");
      };

      img.src = url;
    }

    document.getElementById("downloadBtn").addEventListener("click", downloadCertificateAsJPG);
  </script>
</body>
</html>
