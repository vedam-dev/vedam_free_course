<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Certificate of Completion</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #4b1869;
      --muted: #7a7a7a;
      --name: #4d2180;
      --page-bg: #f3f5f7;
      --card-width: 1100px;
      --card-height: 800px;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--page-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .certificate {
      width: var(--card-width);
      height: var(--card-height);
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(20,20,30,0.25);
      background-image: url('certiBg.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 56px 72px;
      box-sizing: border-box;
    }

    .content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    h1.c-title {
      margin: 120px 0px;
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: 52px;
      color: black;
      line-height: 1.02;
    }

    .subtitle {
      color: var(--muted);
      font-size: 22px;
      font-weight: 400;
    }

    .recipient {
      margin-top: 28px;
      font-family: "Poppins", sans-serif;
      font-size: 36px;
      color: var(--name);
      font-weight: 700;
    }

    .meta {
      margin-top: 20px;
      color: var(--muted);
      font-size: 22px;
      font-weight: 400;
    }

    .meta strong {
      color: #2b2b2b;
      font-weight: 700;
    }

    /* SVG gradient text - html2canvas compatible */
    .course-brand {
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: 22px;
      margin-left: 6px;
      display: inline-block;
      position: relative;
    }

    .signature-block {
      position: absolute;
      left: 72px;
      bottom: 64px;
    }

    .signature-block .sig-name {
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #0f1724;
    }

    .signature-block .sig-title {
      font-size: 14px;
      color: var(--muted);
    }

    button#downloadBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4b1869;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    button#downloadBtn:hover {
      background: #5e1f89;
    }
  </style>
</head>
<body>
 <div class="certificate" id="certificate" role="img" aria-label="Certificate frame background">
    <div class="content">
      <!-- left main block containing the textual certificate content -->
      <div class="main">
        <h1 class="c-title">Certificate of Completion</h1>
        <div class="subtitle">Proudly presented to</div>

        <!-- recipient name (change text) -->
        <div class="recipient">{{Your Name here}}</div>

        <!-- smaller explanation row -->
        <div class="meta">
          <span>For successfully completing
            <strong>{{Subject Name here}}</strong>
            <span class="course-brand">
              <svg width="140" height="28" xmlns="http://www.w3.org/2000/svg" style="vertical-align: -8.1px;">
                <defs>
                  <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#6a2bd6;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f07a2b;stop-opacity:1" />
                  </linearGradient>
                </defs>
                <text x="0" y="22" font-family="Poppins, sans-serif" font-size="22" font-weight="700" fill="url(#textGradient)">CodeSprint</text>
              </svg>
            </span></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
