name: Build and Deploy vedam-free-course

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image
        run: |
          docker build \
            --build-arg ENV=dev \
            -t vedam-free-course:latest \
            -t ghcr.io/${{ github.repository_owner }}/vedam-free-course:latest \
            .

      - name: Push to GitHub Container Registry
        run: docker push ghcr.io/${{ github.repository_owner }}/vedam-free-course:latest

      - name: Save Docker image to tarball
        run: docker save vedam-free-course:latest -o vedam-free-course.tar

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.REMOTE_IP }} >> ~/.ssh/known_hosts

      - name: Copy image to remote server
        run: scp -i ~/.ssh/id_rsa vedam-free-course.tar root@${{ secrets.REMOTE_IP }}:/tmp/

      - name: Deploy to remote server
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.REMOTE_IP }} << 'EOF'
            # Load the image
            docker load -i /tmp/vedam-free-course.tar
            
            # Stop and remove existing container
            docker rm -f vedam-free-course || true
            
            # Run new container with environment variables
            docker run -d \
              --name vedam-free-course \
              --restart unless-stopped \
              -p 3002:3000 \
              --env-file /path/to/remote/.env \
              vedam-free-course:latest
            
            # Cleanup
            rm /tmp/vedam-free-course.tar
            docker system prune -af --volumes
          EOF
