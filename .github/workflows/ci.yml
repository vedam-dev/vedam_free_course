name: Build and Deploy Docker Image to Remote Server -1

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build --build-arg GITHUB_TOKEN=${{ secrets.MY_GITHUB_TOKEN }} -t vedam-free-course:latest .

      - name: Save Docker image to tarball
        run: docker save vedam-free-course:latest -o vedam-free-course.tar

      - name: Save SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy Docker image to remote server
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa vedam-free-course.tar root@${{ secrets.REMOTE_IP }}:/tmp/vedam-free-course.tar

    
      - name: Load and run Docker image on remote server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@${{ secrets.REMOTE_IP }} << 'EOF'
            docker load -i /tmp/vedam-free-course.tar
            docker rm -f vedam-free-course || true
            docker run -d -p 127.0.0.1:3002:3000 --name vedam-free-course vedam-free-course:latest
            docker system prune -a --force
          EOF
